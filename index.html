<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Love.💕</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
    }
    canvas {
      display: block;
    }

    /* 🎵 PANTALLA INICIAL PARA ACTIVAR MÚSICA */
    .pantalla-inicio {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: opacity 0.8s ease;
    }

    .btn-reproducir {
      background-color: #ff94b4;
      color: #ffffff;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: bold;
      border: 3px solid #ffffff;
      padding: 15px 30px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 148, 180, 0.8);
      animation: pulso 1.5s infinite ease-in-out;
    }

    @keyframes pulso {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* 🌸 VERSOS UBICADOS ABAJO DEL CORAZÓN */
    .texto-abajo {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.9), 0 0 20px rgba(255, 182, 193, 0.7);
      pointer-events: none;
      padding: 0 20px;
      line-height: 1.4;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      opacity: 0;
      transform: translateY(10px);
      z-index: 10;
    }

    .texto-abajo.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- 🎵 AUDIO -->
  <audio id="musicaFondo" loop preload="auto" playsinline>
    <source src="cancion.mp3" type="audio/mpeg">
  </audio>

  <!-- 💖 PANTALLA INICIAL DE BIENVENIDA -->
  <div class="pantalla-inicio" id="pantallaInicio">
    <button class="btn-reproducir" onclick="iniciarExperiencia()">
      ¡Click! 💕
    </button>
  </div>

  <canvas id="heartCanvas"></canvas>
  
  <!-- 🌸 CONTENEDOR DE VERSOS ABAJO -->
  <div class="texto-abajo" id="textoFrase"></div>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const musica = document.getElementById('musicaFondo');
    const elementoTexto = document.getElementById('textoFrase');

    // TUS 8 VERSOS DE LA CANCIÓN
    const versos = [
      "Vamos, no me dejes, no puede ser tan fácil, babe.",
      "Si me crees, supongo que me subiré a un avión.",
      "Vuelo a tu ciudad emocionada por ver tu cara.",
      "Abrázame, consuélame y luego me iré sin dejar rastro..",
      "Vamos, no me dejes, no puede ser tan fácil, babe.",
      "Si me crees, supongo que me subiré a un avión.",
      "Vuelo a tu ciudad emocionada por ver tu cara.",
      "Abrázame, consuélame y luego me iré sin dejar rastro.."
    ];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function iniciarExperiencia() {
      musica.play().catch(e => console.log("Error de audio:", e));
      
      const inicio = document.getElementById('pantallaInicio');
      inicio.style.opacity = '0';
      setTimeout(() => {
        inicio.style.display = 'none';
        iniciarAnimacionCorazon();
        reproducirVersos();
      }, 800);
    }

    // 🕒 REPRODUCCIÓN DE VERSOS EN 32.7 SEGUNDOS TOTALES (~4087 ms por verso)
    function reproducirVersos() {
      let indice = 0;
      const tiempoPorVerso = 32700 / versos.length; // 4087.5 ms por verso

      function mostrarSiguienteVerso() {
        if (indice < versos.length) {
          elementoTexto.textContent = versos[indice];
          elementoTexto.classList.add('visible');

          // Ocultar un poco antes de cambiar de verso para un fundido suave
          setTimeout(() => {
            elementoTexto.classList.remove('visible');
          }, tiempoPorVerso - 600);

          indice++;
          setTimeout(mostrarSiguienteVerso, tiempoPorVerso);
        } else {
          // Mantener el último verso visible en pantalla al terminar
          elementoTexto.textContent = versos[versos.length - 1];
          elementoTexto.classList.add('visible');
        }
      }

      mostrarSiguienteVerso();
    }

    // Ecuación matemática del corazón
    function heart(a, scale) {
      const x = 16 * Math.pow(Math.sin(a), 3) * scale;
      const y = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale;
      return { x, y: -y };
    }

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    // 🔄 CORAZÓN QUE SE REINICIA CADA 6 SEGUNDOS
    let animId = null;

    function iniciarAnimacionCorazon() {
      let tiempoInicio = Date.now();

      function dibujaPaso() {
        const tiempoTranscurrido = Date.now() - tiempoInicio;

        // Si pasaron 6000 ms (6 segundos), limpia la pantalla y reinicia el ciclo
        if (tiempoTranscurrido >= 6000) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          tiempoInicio = Date.now();
        }

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 - 40;

        // Dibujar relleno
        for (let step = 0; step < 20; step++) {
          const a = random(0, 2 * Math.PI);
          const sc = random(0.3, 11);
          const pos = heart(a, sc);

          const ang = Math.atan2(pos.y, pos.x) + random(-0.5, 0.5);
          const length = random(4, 14);

          const r = 255;
          const g = Math.floor(random(60, 140));
          const b = Math.floor(random(160, 220));

          ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
          ctx.lineWidth = random(0.5, 1.2);

          const x1 = centerX + pos.x;
          const y1 = centerY + pos.y;
          const x2 = x1 + length * Math.cos(ang);
          const y2 = y1 + length * Math.sin(ang);

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        // Dibujar destellos
        for (let step = 0; step < 8; step++) {
          const a = random(0, 2 * Math.PI);
          const pos = heart(a, 12);

          const ang = Math.atan2(pos.y, pos.x) + random(-0.35, 0.35);
          const length = random(8, 25);

          const r = 255;
          const g = Math.floor(random(115, 190));
          const b = Math.floor(random(190, 240));

          ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
          ctx.lineWidth = random(0.4, 0.9);

          const x1 = centerX + pos.x + random(-2, 2);
          const y1 = centerY + pos.y + random(-2, 2);
          const x2 = x1 + length * Math.cos(ang);
          const y2 = y1 + length * Math.sin(ang);

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        animId = requestAnimationFrame(dibujaPaso);
      }

      dibujaPaso();
    }
  </script>
</body>
</html>
